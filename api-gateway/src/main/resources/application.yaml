spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Forward each service's OpenAPI document through the gateway so the
            # central Swagger UI can load it from the same origin.
            - id: account-service-openapi
              uri: http://localhost:8081
              predicates:
                - Path=/docs/accounts/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: transaction-service-openapi
              uri: http://localhost:8082
              predicates:
                - Path=/docs/transactions/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            # Account service route
            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@keyResolver}"

            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@keyResolver}"

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: Accounts
    urls:
      - name: Accounts
        url: /docs/accounts/v3/api-docs
      - name: Transactions
        url: /docs/transactions/v3/api-docs

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
